name: Android CI / CD Build & Test

on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
  workflow_dispatch:
    inputs:
      publish_release:
        description: "Publish GitHub Release"
        required: false
        default: false
        type: boolean

permissions:
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build, Test & Package APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
          cache-read-only: false

      - name: Make Gradle Wrapper Executable
        run: chmod +x android/gradlew

      # Unit tests temporarily skipped; can be re-enabled later
      # - name: Run Unit Tests
      #   working-directory: android
      #   run: |
      #     set -o pipefail
      #     ./gradlew testDebugUnitTest --continue --stacktrace 2>&1 | tee -a build-execution.log

      - name: Run Android Lint Check
        working-directory: android
        run: |
          set -o pipefail
          ./gradlew lintDebug --stacktrace 2>&1 | tee -a build-execution.log

      - name: Determine Version & Tag
        id: versioning
        run: |
          VERSION_CODE="${{ github.run_number }}"
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            VERSION_NAME="${GITHUB_REF_NAME#v}"
            RELEASE_TAG="${GITHUB_REF_NAME}"
          else
            VERSION_NAME="1.0.${{ github.run_number }}"
            RELEASE_TAG="v1.0.${{ github.run_number }}"
          fi
          echo "version_code=${VERSION_CODE}" >> "$GITHUB_OUTPUT"
          echo "version_name=${VERSION_NAME}" >> "$GITHUB_OUTPUT"
          echo "release_tag=${RELEASE_TAG}" >> "$GITHUB_OUTPUT"

      - name: Assemble Release APK
        working-directory: android
        run: |
          set -o pipefail
          ./gradlew assembleRelease -PversionCode=${{ steps.versioning.outputs.version_code }} -PversionName=${{ steps.versioning.outputs.version_name }} -x test --stacktrace 2>&1 | tee -a build-execution.log

      - name: Prepare Release APK Named Asset
        working-directory: android
        run: |
          mv app/build/outputs/apk/release/app-release.apk app/build/outputs/apk/release/ExpenseTracker-${{ steps.versioning.outputs.release_tag }}.apk

      - name: Upload Release APK Artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: expense-tracker-release-apk
          path: android/app/build/outputs/apk/release/ExpenseTracker-*.apk
          retention-days: 30
          if-no-files-found: warn

      - name: Publish GitHub Release
        if: success() && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v') || inputs.publish_release == true)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.versioning.outputs.release_tag }}
          name: "Expense Tracker ${{ steps.versioning.outputs.release_tag }}"
          files: |
            android/app/build/outputs/apk/release/ExpenseTracker-${{ steps.versioning.outputs.release_tag }}.apk
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Unit Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: junit-test-reports
          path: android/app/build/reports/tests/
          retention-days: 14
          if-no-files-found: ignore

      - name: Collect & Generate Error Logs
        if: failure()
        working-directory: android
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p error-artifacts
          
          # Write comprehensive error diagnostic header
          {
            echo "=========================================================="
            echo "              BUILD FAILURE DIAGNOSTIC REPORT             "
            echo "=========================================================="
            echo "Timestamp:       $(date -u)"
            echo "Repository:      ${{ github.repository }}"
            echo "Branch / Ref:    ${{ github.ref }}"
            echo "Commit SHA:      ${{ github.sha }}"
            echo "Triggered By:    ${{ github.actor }}"
            echo "Workflow Event:  ${{ github.event_name }}"
            echo "=========================================================="
            echo "--- BUILD ISSUES & ROOT CAUSES ---"
            if [ -f build-execution.log ]; then
              echo ">>> COMPILER & KSP DIAGNOSTICS:"
              grep -E '(e: |error:|ERROR:|\[ksp\]|> Task .* FAILED)' build-execution.log | head -n 40 || true
              echo ""
              echo ">>> GRADLE EXECUTION SUMMARY:"
              # Extract the failure section and root causes, filtering out internal Gradle reflection frames
              awk '
                /FAILURE: Build failed/ { recording=1 }
                recording {
                  if ($0 !~ /^\s+at (org\.gradle\.|java\.base\/|jdk\.internal)/) {
                    print $0
                  }
                }
              ' build-execution.log > /tmp/failure_extracted.txt

              if [ -s /tmp/failure_extracted.txt ]; then
                cat /tmp/failure_extracted.txt
              else
                grep -E '(> Task .* FAILED|e: |ERROR:|FAILURE:|Caused by:|\* What went wrong:)' build-execution.log | head -n 50
              fi
            else
              echo "No build-execution.log found."
            fi
          } > error-artifacts/error-summary.txt

          echo "=========================================================="
          cat error-artifacts/error-summary.txt
          echo "=========================================================="
          cat error-artifacts/error-summary.txt >> $GITHUB_STEP_SUMMARY

          if [ -s error-artifacts/error-summary.txt ]; then
            gh api "repos/${{ github.repository }}/commits/${{ github.sha }}/comments" \
              -f body="$(cat error-artifacts/error-summary.txt | head -c 60000)" || true
          fi

          # Copy entire console execution log
          if [ -f build-execution.log ]; then
            cp build-execution.log error-artifacts/build-execution.log
          fi

          # Copy Gradle daemon logs if available
          if [ -d "$HOME/.gradle/daemon" ]; then
            mkdir -p error-artifacts/daemon-logs
            cp -r "$HOME/.gradle/daemon"/*/*.log error-artifacts/daemon-logs/ 2>/dev/null || true
          fi

          # Copy test and lint reports if available
          if [ -d "app/build/reports" ]; then
            mkdir -p error-artifacts/reports
            cp -r "app/build/reports"/* error-artifacts/reports/ 2>/dev/null || true
          fi

      - name: Upload Error Logs Artifact
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-failure-logs
          path: android/error-artifacts/
          retention-days: 14
          if-no-files-found: warn
