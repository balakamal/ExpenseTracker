name: Android CI / CD Build & Test

on:
  push:
    branches: [ "main", "master", "001-local-expense-tracker" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build, Test & Package APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"
          cache-read-only: false

      - name: Prepare Gradle Wrapper
        run: |
          cd android
          if [ ! -f gradlew ]; then
            gradle wrapper --gradle-version 8.7
          fi
          chmod +x gradlew

      - name: Run Unit Tests
        run: |
          cd android && (./gradlew testDebugUnitTest --continue || gradle testDebugUnitTest --continue)

      - name: Run Android Lint Check
        run: |
          cd android && (./gradlew lintDebug || gradle lintDebug)

      - name: Assemble Debug & Release APKs
        run: |
          cd android && (./gradlew assembleDebug assembleRelease || gradle assembleDebug assembleRelease)

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: apex-expense-tracker-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          retention-days: 30
          if-no-files-found: warn

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: apex-expense-tracker-release-apk
          path: android/app/build/outputs/apk/release/*.apk
          retention-days: 30
          if-no-files-found: warn

      - name: Upload Unit Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: junit-test-reports
          path: android/app/build/reports/tests/
          retention-days: 14
          if-no-files-found: ignore
